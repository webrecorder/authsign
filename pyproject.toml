[project]
name = "authsign"
version = "0.6.1"
description = "Authenticating Data Signing + Verification Server"
readme = "README.md"
authors = [
    {name = "Webrecorder Software", email = "info@webrecorder.net"}
]
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "cryptography",
    "rfc3161ng",
    "pem",
    "fastapi",
    "uvicorn",
    "pyyaml",
    "acme",
    "pyasn1",
    "pydantic",
    "httpx2",
]

[project.urls]
Repository = "https://github.com/webrecorder/authsign"

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "black>=24.8.0",
    "coverage>=7.6.1",
    "mypy>=1.19.1",
    "pip>=25.0.1",
    "pylint>=3.2.7",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.package-dir]
authsign = "authsign"

[tool.setuptools.package-data]
authsign = ["log.json"]
"authsign.trusted" = ["*"]

